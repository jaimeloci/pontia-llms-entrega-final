[project]
name = "pontia-llms-entrega-final"
version = "0.1.0"
description = "Entorno reproducible para el notebook entrega_final.ipynb."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "ipykernel",
  "jsonschema",
  "jupyterlab",
  "langchain>=1.4.3",
  "langchain-core>=1.6.6",
  "langchain-openai>=1.6.7",
  "langchain-text-splitters>=1.1.3",
  "matplotlib>=3.11.2",
  "numpy",
  "openai",
  "pandas",
  "pypdf>=6.19.0",
  "python-dotenv",
  "requests",
]

[tool.uv]
package = false
python-preference = "managed"
