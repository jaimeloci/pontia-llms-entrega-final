[project]
name = "pontia-llms-entrega-final"
version = "0.1.0"
description = "Entorno reproducible."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # --- Entorno interactivo Jupyter ---
    "ipykernel==7.2.0",
    "jupyterlab==4.5.7",

    # --- Ecosistema LangChain, LangGraph y OpenAI ---
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.12",
    "openai==3.24.0",
    "tiktoken==0.14.0",

    # --- Procesamiento de datos, PDF y visualización ---
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pypdf==6.19.0",

    # --- Red, validación de esquemas y configuración ---
    "jsonschema==4.26.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[tool.uv]
package = false
python-preference = "managed"